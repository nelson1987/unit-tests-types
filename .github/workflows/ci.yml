name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: unitdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore UnitTestsTypes.sln

      - name: Build solution
        run: dotnet build UnitTestsTypes.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: dotnet test tests/UnitTestsTypes.UnitTests/UnitTestsTypes.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/unit --verbosity normal

      - name: Run integration tests with coverage
        run: dotnet test tests/UnitTestsTypes.IntegrationTests/UnitTestsTypes.IntegrationTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/integration --verbosity normal

      - name: Run persistence benchmarks
        run: dotnet run --project benchmarks/Benchmarks.Persistence/Benchmarks.Persistence.csproj --configuration Release --no-build

      - name: Start API for performance validation
        run: |
          nohup dotnet run --project src/UnitTestsTypes.Api/UnitTestsTypes.Api.csproj --configuration Release --no-build --urls http://127.0.0.1:5000 > /tmp/unit-tests-types-api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          cat /tmp/unit-tests-types-api.log
          exit 1

      - name: Install k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Run k6 performance test
        run: k6 run --quiet performance/k6/customer-api.js

      - name: Install report generator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:"Html;TextSummary"

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Run mutation tests
        run: dotnet stryker --configFile stryker-config.json --reporter cleartext

      - name: Install dotnet-format
        run: dotnet tool install --global dotnet-format

      - name: Check formatting
        run: dotnet format UnitTestsTypes.sln --verify-no-changes

      - name: Upload coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coveragereport
            TestResults
            BenchmarkDotNet.Artifacts
            StrykerOutput
