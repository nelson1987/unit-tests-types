name: Merge to Main

on:
  workflow_dispatch:

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore UnitTestsTypes.sln

      - name: Build and test
        run: |
          dotnet build UnitTestsTypes.sln --configuration Release --no-restore
          dotnet test tests/UnitTestsTypes.UnitTests/UnitTestsTypes.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/UnitTestsTypes.IntegrationTests/UnitTestsTypes.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

      - name: Install dotnet-format
        run: dotnet tool install --global dotnet-format

      - name: Check formatting
        run: dotnet-format --verify-no-changes --folder .

      - name: Merge feature branch to main
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout main
          git merge --no-ff "${GITHUB_REF#refs/heads/}" -m "Merge ${GITHUB_REF#refs/heads/} into main"
          git push origin main
