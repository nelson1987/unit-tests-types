services:
  postgres:
    image: postgres:16
    container_name: unit-tests-postgres
    environment:
      POSTGRES_DB: unitdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  rabbitmq:
    image: rabbitmq:3-management
    container_name: unit-tests-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: unit-tests-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
